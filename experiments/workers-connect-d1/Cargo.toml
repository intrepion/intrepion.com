[package]
name = "workers-connect-d1-experiment"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "native-baseline"
path = "src/bin/native-baseline.rs"
required-features = ["native-baseline"]

[features]
native-baseline = ["dep:tokio", "axum/tokio", "axum/http1"]

[dependencies]
axum = { version = "0.8", default-features = false }
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9", default-features = false, features = ["axum", "json"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread", "net"] }
worker = { version = "0.8", features = ["http", "axum", "d1"] }

[build-dependencies]
connectrpc-build = "0.9"

[profile.release]
opt-level = "s"
lto = true
