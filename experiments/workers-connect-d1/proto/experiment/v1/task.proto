syntax = "proto3";

package experiment.v1;

service TaskService {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc CreateTask(Task) returns (Task);
  rpc ListTasks(Empty) returns (TaskList);
  rpc UpdateTask(Task) returns (Task);
  rpc DeleteTask(TaskId) returns (Empty);
}

message Empty {}
message TaskId { string id = 1; }
message Task {
  string id = 1;
  string title = 2;
  string notes = 3;
  bool completed = 4;
}
message TaskList { repeated Task tasks = 1; }

message EchoRequest {
  string title = 1;
}

message EchoResponse {
  string title = 1;
}
