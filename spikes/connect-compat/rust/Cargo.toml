[package]
name = "connect-compat-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
axum = "=0.8.9"
buffa = { version = "=0.9.2", features = ["json"] }
connectrpc = { version = "=0.9.1", default-features = false, features = ["axum", "client", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }

[build-dependencies]
connectrpc-build = "=0.9.0"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
