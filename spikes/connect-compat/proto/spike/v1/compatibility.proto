syntax = "proto3";

package spike.v1;

option java_package = "com.intrepion.spike.v1";
option java_multiple_files = true;
option swift_prefix = "SpikeV1";

// A disposable transport check, not an application or authentication API.
service CompatibilityService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  // Dummy platform label only. Do not send names or other personal information.
  string client_name = 1;
}

message PingResponse {
  string message = 1;
  string server = 2;
}
