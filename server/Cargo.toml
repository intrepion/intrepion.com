[package]
name = "intrepion-server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
dev-auth = []

[dependencies]
axum = "0.8"
aws-lc-rs = "1"
base64 = "0.22"
x509-cert = "0.3"
time = {version="0.3",features=["parsing"]}
aws-credential-types = "1"
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
connectrpc = { version = "0.9", default-features = false, features = ["axum", "json"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
url = "2"

[build-dependencies]
connectrpc-build = "0.9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
